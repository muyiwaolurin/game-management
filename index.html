<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playtime — Coach Game Management</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div class="bezel" id="bezel">
      <div id="frame"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="engine.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="setup.jsx"></script>
  <script type="text/babel" src="live.jsx"></script>
  <script type="text/babel" src="stats.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="react">
    // ── scale the 667×375 landscape frame to fit the viewport ──
    function fit() {
      const bezel = document.getElementById('bezel');
      if (!bezel) return;
      const pad = 24;
      const fw = 667 + 24, fh = 375 + 24; // frame + bezel padding
      const sx = (window.innerWidth - pad) / fw;
      const sy = (window.innerHeight - pad) / fh;
      const scale = Math.min(sx, sy, 2.6);
      bezel.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();

    function mount() {
      if (!window.PlaytimeApp) { setTimeout(mount, 30); return; }
      const root = ReactDOM.createRoot(document.getElementById('frame'));
      root.render(React.createElement(window.PlaytimeApp));
      requestAnimationFrame(fit);
    }
    mount();
  </script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0052CC"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M50 30 L57 45 L50 56 L43 45 Z" fill="#fff"/>
      <path d="M50 24 v6 M50 56 v6 M30 50 h6 M64 50 h6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </template>
</body>
</html>
